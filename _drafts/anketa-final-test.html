:root{
  --bg:#ede6da; --ink:#1f1c18; --muted:#8a8072; --line:#d6ccbc; --soft:#e4dccd;
  --sel:#1f1c18; --selInk:#f5f0e8; --accent:#b8553a; --paper:#f5f0e8; --sky:#bfe0f5;
  --font:Stolzl,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:18px 28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* служебная панель прототипа */
.snd{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.snd svg{width:16px;height:16px}
.snd[aria-pressed="false"] .on{display:none}.snd[aria-pressed="true"] .off{display:none}

.top{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.back{border:0;background:none;font:inherit;font-size:18px;color:var(--ink);padding:0;width:20px;cursor:pointer;visibility:hidden}
.back.show{visibility:visible}
.bar{flex:1;height:1px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:-0.5px;height:2px;background:var(--ink);width:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.plabel{font-size:12px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:44px;text-align:right}

#stage{position:relative;flex:1}
.card{will-change:transform,opacity}
.card.out{animation:out .26s ease forwards}
.card.outback{animation:outback .26s ease forwards}
.card.in{animation:in .42s cubic-bezier(.2,.8,.2,1) both}
.card.inback{animation:inback .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes out{to{opacity:0;transform:translateX(-28px)}}
@keyframes outback{to{opacity:0;transform:translateX(28px)}}
@keyframes in{from{opacity:0;transform:translateX(28px)}}
@keyframes inback{from{opacity:0;transform:translateX(-28px)}}

h1{font-weight:500;font-size:30px;line-height:1.08;letter-spacing:-.03em;margin:0 0 10px;text-wrap:balance}
h1 .w{display:inline-block;animation:word .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes word{from{opacity:0;transform:translateY(.4em)}}
.hint{color:var(--muted);font-size:14px;margin:0 0 24px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;font-weight:500;font-size:15px;letter-spacing:-.01em;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:14px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .2s,border-color .2s,color .2s,transform .15s;animation:optin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes optin{from{opacity:0;transform:translateY(8px)}}
.opt:hover{border-color:var(--muted)}
.opt:active{transform:scale(.985)}
.opt:focus-visible,.next:focus-visible,.own:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .box{flex:none;width:16px;height:16px;border:1px solid var(--muted);border-radius:50%;display:grid;place-items:center}
.opt.sel{background:var(--sel);color:var(--selInk);border-color:var(--sel)}
.opt.sel .box{border-color:var(--selInk)}
.opt.sel .box::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--selInk);animation:dot .25s ease}
@keyframes dot{from{transform:scale(0)}}
.opt.pop{animation:pop .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{40%{transform:scale(1.025)}}

/* «Своё» — заметная строка */
.own{font:inherit;font-weight:500;font-size:15px;text-align:left;color:var(--accent);background:transparent;border:1.5px dashed var(--accent);border-radius:999px;padding:14px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;animation:optin .45s cubic-bezier(.2,.8,.2,1) both}
.own .plus{flex:none;width:16px;height:16px;border-radius:50%;background:var(--accent);color:var(--paper);display:grid;place-items:center;font-size:13px;line-height:1}
.own.filled{background:var(--accent);color:var(--paper);border-style:solid}
.own.filled .plus{background:var(--paper);color:var(--accent)}
.ownbox{display:none;margin-top:4px}
.ownbox.show{display:block;animation:optin .3s ease both}
input.text{width:100%;font:inherit;font-size:16px;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);outline:none;border-radius:0}
input.text::placeholder{color:#b3a999}
input.text:focus{border-bottom-color:var(--ink)}
.err{color:#a5432f;font-size:13px;min-height:18px;margin-top:10px}
.next{margin-top:24px;width:100%;font:inherit;font-weight:500;font-size:15px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:16px;cursor:pointer;transition:opacity .2s,transform .15s}
.next:disabled{opacity:.25;cursor:default}
.next:not(:disabled):active{transform:scale(.985)}

/* A: реакция строкой под вариантами */
.react{margin-top:14px;font-size:14px;color:var(--accent);min-height:20px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.react.show{opacity:1;transform:none}

/* B: обложка 4:1 */
.cover{display:none;aspect-ratio:4/1;max-width:100%;border-radius:16px;background:var(--paper);margin-bottom:22px;overflow:hidden;position:relative}
.v-b .cover,.v-d .cover{display:block;animation:optin .5s cubic-bezier(.2,.8,.2,1) both}
.cover svg{width:100%;height:100%;display:block}

/* C: всплывающая карточка-реакция */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 80px));width:min(392px,calc(100% - 32px));background:var(--ink);color:var(--paper);border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:center;z-index:20;transition:transform .45s cubic-bezier(.2,1.3,.3,1)}
.toast.show{transform:translate(-50%,0)}
.toast .em{font-size:30px;line-height:1;flex:none;animation:none}
.toast.show .em{animation:wob .7s ease .1s}
@keyframes wob{30%{transform:rotate(-14deg) scale(1.2)}60%{transform:rotate(10deg)}}
.toast b{display:block;font-weight:500;font-size:15px;letter-spacing:-.01em}
.toast span{font-size:13px;opacity:.7}
.mile{position:absolute;right:0;top:-26px;font-size:12px;color:var(--accent);opacity:0;transition:opacity .3s}
.mile.show{opacity:1}
.pill-layer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:25;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.pill{background:var(--sky);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:18px 28px;font-weight:500;font-size:20px;letter-spacing:-.02em;line-height:1.2;text-align:center;max-width:340px;text-wrap:balance;opacity:0;transform:translateY(24px) scale(.7) rotate(-6deg);box-shadow:0 0 0 0 rgba(31,28,24,0)}
.pill .pw{display:inline-block;opacity:0;transform:translateY(.5em)}
.pill.show{animation:pillin .45s cubic-bezier(.2,1.45,.35,1) forwards}
.pill.show .pw{animation:pw .3s cubic-bezier(.2,.8,.2,1) forwards}
.pill.show::after{content:"";position:absolute}
.pill.hide{animation:pillout .3s cubic-bezier(.5,0,.75,0) forwards}
.pill.hide .pw{opacity:1;transform:none}
@keyframes pillin{0%{opacity:0;transform:translateY(24px) scale(.7) rotate(-6deg)}60%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1) rotate(-2deg);box-shadow:0 10px 0 -2px rgba(31,28,24,.9)}}
@keyframes pw{to{opacity:1;transform:none}}
@keyframes pillout{from{opacity:1;transform:translateY(0) scale(1) rotate(-2deg);box-shadow:0 10px 0 -2px rgba(31,28,24,.9)}to{opacity:0;transform:translateY(-40px) scale(.9) rotate(2deg);box-shadow:0 0 0 0 rgba(31,28,24,0)}}
#stage{transition:opacity .2s ease,filter .2s ease,transform .2s ease}
#stage.gone{opacity:0;filter:blur(6px);transform:scale(.97)}
.top{transition:opacity .35s}
.gone-top .top,.gone-top .foot{opacity:0}
.foot{transition:opacity .35s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* финал */
.done{text-align:center;padding-top:8vh}
.done .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.promo{display:inline-flex;margin-top:18px;padding:16px 28px;border:1px solid var(--ink);border-radius:999px;font-weight:500;font-size:26px;letter-spacing:.08em;user-select:all;font-variant-numeric:tabular-nums;min-width:210px;justify-content:center}
.promo.stamp{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-6deg)}}
.done .hint{margin:10px auto 0;max-width:300px}
.shot{margin:26px auto 0;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:optin .5s cubic-bezier(.2,.8,.2,1) .35s both}
.shot b{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.shot .cam{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--sky);border:1.5px solid var(--ink);font-size:19px;animation:snap 1.6s ease 1s 2}
@keyframes snap{0%,100%{transform:scale(1)}10%{transform:scale(.86)}20%{transform:scale(1.08)}30%{transform:scale(1)}}
.shot span{font-size:15px;color:var(--muted);line-height:1.4}
/* стартовый экран: всё по центру */
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:2vh}
.intro h1{font-size:28px;line-height:1.1;max-width:340px}
.intro .thanks{font-weight:500;font-size:17px;letter-spacing:-.01em;color:var(--muted);margin:2px 0 0;animation:optin .5s cubic-bezier(.2,.8,.2,1) .4s both}
.intro .next{animation:optin .5s cubic-bezier(.2,.8,.2,1) .7s both}
.rise{animation:optin .55s cubic-bezier(.2,.8,.2,1) both}
/* 1 · Круг */
.i1 .ph{width:148px;height:148px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink);animation:avain .7s cubic-bezier(.2,1.4,.35,1) both}
.i1 .ph img,.i2 .ph img,.i3 .me img{width:100%;height:100%;object-fit:cover;display:block}
.i1 .tag{margin:-18px 0 22px;position:relative;background:var(--sky);border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px;transform:rotate(-4deg);animation:tagin .5s cubic-bezier(.2,1.5,.35,1) .35s both}
@keyframes tagin{from{opacity:0;transform:rotate(-12deg) scale(.5)}}
@keyframes avain{from{opacity:0;transform:scale(.6)}}
.path{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px 0 4px;animation:optin .5s cubic-bezier(.2,.8,.2,1) .55s both;flex-wrap:wrap}
.path .st{display:flex;flex-direction:column;align-items:center;gap:2px}
.path .st b{font-weight:500;font-size:22px;letter-spacing:-.02em;line-height:1}
.path .st span{font-size:12px;color:var(--muted)}
.path .ar{color:var(--muted);font-size:16px}
.path .gift{background:var(--sky);border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px}
/* 2 · Полароид */
.i2 .ph{width:210px;aspect-ratio:4/5;max-width:100%;background:var(--paper);padding:10px 10px 0;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 14px 30px -12px rgba(60,40,20,.35);transform:rotate(-3deg);animation:polin .8s cubic-bezier(.2,1.3,.35,1) both;position:relative}
.i2 .ph .im{width:100%;height:calc(100% - 34px);overflow:hidden;border-radius:2px}
.i2 .ph .cap{height:34px;display:grid;place-items:center;font-weight:500;font-size:13px;color:var(--muted)}
.i2 .ph .stk{position:absolute;right:-22px;top:18px;background:var(--sky);border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:500;font-size:13px;transform:rotate(8deg);animation:tagin .5s cubic-bezier(.2,1.5,.35,1) .5s both}
@keyframes polin{from{opacity:0;transform:rotate(-12deg) translateY(30px) scale(.85)}}
.i2 h1{margin-top:30px}
.line{margin:22px 0 0;font-weight:500;font-size:16px;line-height:1.7;max-width:320px;animation:optin .5s cubic-bezier(.2,.8,.2,1) .55s both}
.line .hl{background:var(--sky);border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap}
/* 3 · Письмо */
.i3 .from{display:flex;align-items:center;gap:12px;margin-bottom:28px;animation:optin .5s cubic-bezier(.2,.8,.2,1) both}
.i3 .me{width:56px;height:56px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink)}
.i3 .from div{text-align:left}
.i3 .from b{display:block;font-weight:500;font-size:16px}
.i3 .from span{font-size:13px;color:var(--muted)}
.i3 h1{font-size:31px;line-height:1.06;max-width:330px}
.i3 .sub{font-weight:500;font-size:19px;letter-spacing:-.02em;line-height:1.25;margin:14px 0 0;max-width:300px;text-wrap:balance;animation:optin .5s cubic-bezier(.2,.8,.2,1) .3s both}
.i3 .thanks{font-size:15px;margin-top:10px;animation-delay:.45s}
.subwrap{position:relative;display:flex;justify-content:center}
.arrow{position:absolute;right:-30px;top:-34px;width:58px;height:66px;overflow:visible;pointer-events:none}
.arrow path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.arrow .a1{stroke-dasharray:90;stroke-dashoffset:90;animation:draw .55s cubic-bezier(.4,0,.2,1) .75s forwards}
.arrow .a2{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .25s ease-out 1.25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:380px){.arrow{right:-18px;width:46px}}
.dots{display:flex;align-items:center;justify-content:center;gap:6px;margin:30px 0 8px;flex-wrap:wrap;max-width:100%}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);animation:dotin .3s ease both}
.dots i.f{background:var(--ink)}
.dots .gift{margin-left:4px;background:var(--sky);border:1.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:500;font-size:13px;animation:tagin .5s cubic-bezier(.2,1.5,.35,1) both}
@keyframes dotin{from{opacity:0;transform:scale(0)}}
.dots-cap{font-size:13px;color:var(--muted);text-wrap:balance;max-width:300px;animation:optin .4s ease 1.1s both}
.foot{margin-top:auto;padding-top:36px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.ivsw{display:flex;justify-content:center;gap:6px;margin-bottom:14px;font-size:12px;color:var(--muted);align-items:center}
.ivsw button{white-space:nowrap;font:inherit;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.ivsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
</style>

function showPill(text,cb){
  if(pillBusy)return;pillBusy=true;
  const p=$("pill"),s=$("stage"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  s.classList.add("gone");document.body.classList.add("gone-top");
  p.className="pill";p.innerHTML="";
  text.split(" ").forEach((w,k)=>{const x=el("span","pw",w);x.style.animationDelay=(0.08+k*0.035)+"s";p.appendChild(x);p.appendChild(document.createTextNode(" "))});
  setTimeout(()=>{void p.offsetWidth;p.classList.add("show");sPill();buzz(10)},reduce?0:150);
  const hold=reduce?900:150+450+Math.min(800,300+text.length*13);

  setTimeout(()=>{p.className="pill";p.innerHTML="";document.body.classList.remove("gone-top");pillBusy=false;cb&&cb()},hold+260);
}

function ac(){if(!sound)return null;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx}catch(e){return null}}
function tone(f,d,type,vol,at){const c=ac();if(!c)return;const t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.06,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.02)}
let nbuf=null;
function click(at,vol,freq){const c=ac();if(!c)return;if(!nbuf){nbuf=c.createBuffer(1,c.sampleRate*0.02,c.sampleRate);const d=nbuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,6)}
  const t=c.currentTime+(at||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nbuf;f.type="bandpass";f.frequency.value=freq||3200;f.Q.value=1.2;g.gain.value=vol||0.5;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}

      const m=RM[q.key];if(m&&V!=="b"&&V!=="d"){showReact(m,react,()=>go(1),true)}else go(1)};

function validate(k,v){
  if(!v)return "Это поле обязательное";
  if(k==="email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return "Проверь почту, кажется, в ней опечатка";
  if(k==="phone"&&v.replace(/\D/g,"").length<8)return "Проверь номер, в нём мало цифр";
  return "";
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("confetti"),x=cv.getContext("2d"),W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";
  const cols=["#1f1c18","#b8553a","#c9a77a","#8a8072"],P=Array.from({length:120},()=>({x:W/2,y:H*0.45,vx:(Math.random()-.5)*26,vy:-Math.random()*26-8,r:Math.random()*6+4,c:cols[Math.random()*4|0],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let f=0;(function draw(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=0.7;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2.5,p.r*2,p.r/1.2);x.restore()});if(++f<140)requestAnimationFrame(draw);else x.clearRect(0,0,W,H)})();
}
